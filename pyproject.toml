[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revagent"
version = "0.1.0"
description = "Local revision workspace agent for computational mathematics journals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "revagent contributors" }]
keywords = ["latex", "revision", "peer-review", "computational-mathematics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/revagent/revagent"
Issues = "https://github.com/revagent/revagent/issues"
Changelog = "https://github.com/revagent/revagent/blob/main/CHANGELOG.md"

[project.scripts]
revagent = "revagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
