name: Protected Provider E2E

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  synthetic-provider-e2e:
    if: ${{ secrets.REVAGENT_LLM_BASE_URL != '' && secrets.REVAGENT_LLM_API_KEY != '' && secrets.REVAGENT_LLM_MODEL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REVAGENT_LLM_BASE_URL: ${{ secrets.REVAGENT_LLM_BASE_URL }}
      REVAGENT_LLM_API_KEY: ${{ secrets.REVAGENT_LLM_API_KEY }}
      REVAGENT_LLM_MODEL: ${{ secrets.REVAGENT_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: python scripts/provider_e2e.py
      - run: echo "Provider secrets and raw prompts are never uploaded as artifacts."
